# Host-level Nginx on the EC2 instance: reverse proxy -> Docker container on 127.0.0.1:8080
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;

    # Live monitoring snapshot written by monitor.sh (cron)
    location = /monitor/status.json {
        alias /var/lib/devops-monitor/status.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
